name: Compila APK Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurazione Android SDK
        uses: android-actions/setup-android@v3

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'
        
      - name: Genera Gradle Wrapper
        run: gradle wrapper

      - name: Compilazione APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Caricamento APK come Artefatto del Run
        uses: actions/upload-artifact@v4
        with:
          name: Humidex-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Creazione Release su GitHub ed Upload APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ github.run_number }}"
          echo "Creazione release $TAG_NAME..."
          gh release create "$TAG_NAME" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "ARPAV Humidex App - Versione $TAG_NAME" \
            --notes "Scarica l'APK per il test diretto." \
            --target "${{ github.ref_name }}"
